<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8"/>
  <title data-i18n-key="optionsProxyPageTitle"></title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/options.css"/>
</head>

<body class="settings-page">
<div class="main-container">
  <div class="main-page">
    <div class="main-page__image">
      <a href="options.html">
        <img src="../images/settings/quokka.png" width="200" height="auto" alt="Censor Tracker Logo"/>
      </a>
    </div>
    <div class="main-page__info">
      <div class="main-page__return">
        <a class="return-link" href="options.html">
          <svg width="24" height="16" viewBox="0 0 24 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M1.46967 7.46967C1.17678 7.76256 1.17678 8.23744 1.46967 8.53033L6.24264 13.3033C6.53553 13.5962 7.01041 13.5962 7.3033 13.3033C7.59619 13.0104 7.59619 12.5355 7.3033 12.2426L3.06066 8L7.3033 3.75736C7.59619 3.46447 7.59619 2.98959 7.3033 2.6967C7.01041 2.40381 6.53553 2.40381 6.24264 2.6967L1.46967 7.46967ZM22 7.25L2 7.25V8.75L22 8.75V7.25Z"/>
          </svg>
        </a>
      </div>
      <div class="main-page__title page-main-title" data-i18n-key="proxySettings"></div>

      <div id="proxyIsDown" class="proxy__disclaimer" hidden>
        <div data-i18n-key="proxyOptionsStatusTitle" class="disclaimer__title"></div>
        <div data-i18n-key="proxyOptionsStatusDesc" class="disclaimer__text"></div>
      </div>

      <div class="checkbox__group">
        <div class="main-page__turn">
          <label for="useProxyCheckbox" class="toggle-text" data-i18n-key="useProxy"></label>
          <input id="useProxyCheckbox" type="checkbox" class="toggle-button">
        </div>
        <div class="main-page__about">
          <div class="use_proxy__text" data-i18n-key="optionsProxyDesc"></div>
        </div>

        <div id="proxyCustomOptions" hidden>
          <div id="proxyCustomOptionsRadioGroup" class="radio-buttons-group">
            <div class="radio-button">
              <input id="useDefaultProxy" class="radio-button-input" type="radio" name="proxy-radio" value="default"
                     checked>
              <label class="radio-button-label" for="useDefaultProxy" data-i18n-key="useSelectedProxies"></label>
            </div>
            <p id="proxySelectionSummary" class="main-page__about"></p>
            <details id="proxyListOptions" class="settings-section">
              <summary id="proxyManageTitle" data-i18n-key="proxyManage"></summary>
              <p class="main-page__about" data-i18n-key="proxyPoolHelp"></p>
              <details id="proxyFilters" class="settings-section">
                <summary data-i18n-key="proxyFilters"></summary>
                <div class="settings-grid">
                  <div class="settings-field"><label for="proxyFilterServer" data-i18n-key="proxyServerCountry"></label>
                    <select id="proxyFilterServer" name="serverCountry"></select></div>
                  <div class="settings-field"><label for="proxyFilterExit" data-i18n-key="proxyExitCountry"></label>
                    <select id="proxyFilterExit" name="exitCountry"></select></div>
                </div>
                <div class="settings-field"><label for="proxySort" data-i18n-key="proxySort"></label>
                  <select id="proxySort" name="sort">
                    <option value="" data-i18n-key="proxySortDefault"></option>
                    <option value="name" data-i18n-key="proxySortName"></option>
                    <option value="latency" data-i18n-key="proxySortLatency"></option>
                    <option value="serverCountry" data-i18n-key="proxyServerCountry"></option>
                    <option value="exitCountry" data-i18n-key="proxyExitCountry"></option>
                  </select></div>
                <p id="proxyFilteredCount" role="status"></p>
                <button type="button" id="proxyRemoveFiltered" data-i18n-key="proxyRemoveFiltered"></button>
              </details>
              <div class="proxy-table-scroll" tabindex="0" role="region" aria-labelledby="proxyManageTitle">
                <table class="proxy-table">
                  <thead><tr>
                    <th data-i18n-key="proxySelected"></th>
                    <th data-i18n-key="proxyName"></th>
                    <th data-i18n-key="proxyAddress"></th>
                    <th data-i18n-key="proxyCheckResult"></th>
                    <th data-i18n-key="proxyActions"></th>
                  </tr></thead>
                  <tbody id="proxyRows"></tbody>
                </table>
              </div>
              <p id="proxyNoMatches" class="main-page__about" data-i18n-key="proxyNoMatches" hidden></p>
              <div id="proxyPagination" class="settings-actions" hidden>
                <button type="button" id="proxyPrevious" data-i18n-key="proxyPrevious"></button>
                <button type="button" id="proxyNext" data-i18n-key="proxyNext"></button>
              </div>
              <p id="proxyListError" role="alert" hidden></p>
              <details id="proxyCheckOptions" class="settings-section">
                <summary data-i18n-key="proxyCheckTitle"></summary>
                <p class="main-page__about" data-i18n-key="proxyCheckPrivacy"></p>
                <label class="settings-check">
                  <input id="proxyRecoveryEnabled" type="checkbox">
                  <span data-i18n-key="proxyRecoveryEnabled"></span>
                </label>
                <div class="settings-actions">
                  <button type="button" id="proxyCheckSelected" data-i18n-key="proxyCheckSelected"></button>
                  <button type="button" id="proxyCheckAll" data-i18n-key="proxyCheckAll"></button>
                  <button type="button" id="proxyCheckStop" data-i18n-key="proxyCheckStop" disabled></button>
                </div>
                <p id="proxyCheckStatus" role="status"></p>
                <p id="proxyCheckError" role="alert" data-i18n-key="proxyCheckError" hidden></p>
              </details>
              <form id="proxyForm" class="settings-section" aria-labelledby="proxyFormTitle">
                <h2 id="proxyFormTitle" data-i18n-key="proxyAdd"></h2>
                <div class="settings-field">
                  <label for="proxyName" data-i18n-key="proxyNameOptional"></label>
                  <input id="proxyName" type="text" maxlength="100" class="input-proxy">
                </div>
                <div class="settings-grid">
                  <div class="settings-field">
                    <label for="select-toggle" data-i18n-key="proxyProtocol"></label>
                    <select id="select-toggle">
                      <option>HTTPS</option><option>HTTP</option><option>SOCKS5</option><option>SOCKS4</option>
                    </select>
                  </div>
                  <div class="settings-field">
                    <label for="proxyServerInput" data-i18n-key="proxyAddress"></label>
                    <input type="text" required autocomplete="off" spellcheck="false"
                           id="proxyServerInput" class="input-proxy" placeholder="hostname:port">
                  </div>
                </div>
                <details id="proxyAuthOptions" class="settings-section">
                  <summary data-i18n-key="proxyAuthTitle"></summary>
                  <div class="settings-grid">
                    <div class="settings-field">
                      <label for="proxyUsername" data-i18n-key="proxyUsername"></label>
                      <input id="proxyUsername" autocomplete="off" spellcheck="false" class="input-proxy">
                    </div>
                    <div class="settings-field">
                      <label for="proxyPassword" data-i18n-key="proxyPassword"></label>
                      <input id="proxyPassword" type="password" autocomplete="new-password" class="input-proxy">
                    </div>
                  </div>
                  <p class="main-page__about" data-i18n-key="proxyAuthPrivacy"></p>
                  <p id="proxySocksUnsupported" class="main-page__about" data-i18n-key="proxySocksUnsupported" hidden></p>
                </details>
                <label id="proxyRestriction" class="settings-check" hidden>
                  <input id="proxyUnrestricted" type="checkbox" checked>
                  <span data-i18n-key="proxyUnrestricted"></span>
                </label>
                <div class="settings-actions">
                  <button type="submit" class="btn btn-dark" id="saveCustomProxyButton">
                    <span class="btn__text" data-i18n-key="saveCustomProxyButton"></span>
                  </button>
                  <button type="button" id="cancelProxyEdit" data-i18n-key="cancel" hidden></button>
                </div>
              </form>
              <details id="proxyImportOptions" class="settings-section">
                <summary data-i18n-key="proxyImportTitle"></summary>
                <p class="main-page__about" data-i18n-key="proxyImportPrivacy"></p>
                <p class="main-page__about" data-i18n-key="proxyPacWarning"></p>
                <div class="settings-field">
                  <label for="proxyImportProtocol" data-i18n-key="proxyImportProtocol"></label>
                  <select id="proxyImportProtocol">
                    <option>HTTPS</option><option>HTTP</option><option>SOCKS5</option><option>SOCKS4</option>
                  </select>
                </div>
                <div class="settings-field">
                  <label for="proxyImportText" data-i18n-key="proxyImportText"></label>
                  <textarea id="proxyImportText" rows="5" spellcheck="false" maxlength="33554432"></textarea>
                </div>
                <div class="settings-field">
                  <label for="proxyImportFile" data-i18n-key="proxyImportFile"></label>
                  <input id="proxyImportFile" type="file" accept=".txt,.list,.pac">
                </div>
                <div class="settings-actions">
                  <button type="button" id="proxyImportButton" data-i18n-key="proxyImportButton"></button>
                </div>
                <div class="settings-field">
                  <label for="proxyImportUrl" data-i18n-key="proxyImportUrl"></label>
                  <input id="proxyImportUrl" type="url" class="input-proxy" placeholder="https://" maxlength="4096" autocomplete="off">
                </div>
                <div class="settings-actions">
                  <button type="button" id="proxyImportUrlButton" data-i18n-key="proxyImportButton"></button>
                  <button type="button" id="proxySubscribeButton" data-i18n-key="proxySubscribe"></button>
                </div>
                <label class="settings-check">
                  <input id="proxySubscriptionsEnabled" type="checkbox">
                  <span data-i18n-key="proxySubscriptionsEnabled"></span>
                </label>
                <ul id="proxySubscriptions" class="settings-list"></ul>
                <p class="main-page__about" data-i18n-key="proxyAntizapretHelp"></p>
                <button type="button" id="proxyAntizapretImport" data-i18n-key="proxyAntizapretImport"></button>
                <p id="proxyImportStatus" role="status"></p>
              </details>
            </details>

            <div class="radio-button">
              <input class="radio-button-input" type="radio" name="proxy-radio" id="useLocalProxy" value="local">
              <label class="radio-button-label" for="useLocalProxy" data-i18n-key="useLocalProxy"></label>
            </div>

            <p id="localProxyStatus" role="status"></p>
            <div class="block_custom-local-proxy hidden" id="localProxyOptions">
              <div class="censortracker-not-found__wrapper" id="localProxyClientNotFound">
                <div data-i18n-key="localProxyNotFoundDesc"></div>
              </div>
              <div class="local-proxy-links-container" id="localProxyLinksContainer">
                <a href="#" class="local-proxy-link" id="moreAboutAmneziaPremiumLink"
                   data-i18n-key="moreAboutLocalProxy"></a>
                <a href="#" class="local-proxy-link" id="whereToFindAddressLink"
                   data-i18n-key="whereToFindAddressAndPort"></a>
              </div>
            </div>

          </div>
        </div>

        <div id="controlledByOtherExtension" class="main-page__extension" hidden>
          <div class="extension__title" data-i18n-key="controlledByOtherExtensionTitle"
               data-i18n-render-prop="extensionName">
          </div>
          <div class="extension__text" data-i18n-key="controlledByOtherExtensionDesc"
               data-i18n-render-prop="extensionName">
          </div>
          <a class="default-btn disable-other-extensions" data-i18n-key="disableAll"></a>
        </div>

        <div id="controlledByOtherExtensions" class="main-page__extension" hidden>
          <div class="extension__title" data-i18n-key="controlledByOtherExtensions"></div>
          <div class="extension__text">
            <div data-i18n-key="controlledByOtherExtensionsDesc"></div>
            <ol id="extensionsWhichControlsProxy">
            </ol>
          </div>
          <a class="default-btn disable-other-extensions" data-i18n-key="disableAll"></a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
