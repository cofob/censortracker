<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title data-i18n-key="consentTitle">Censor Tracker</title>
  <link rel="stylesheet" href="css/options.css"/>
  <link rel="stylesheet" href="css/consent.css"/>
</head>
<body class="options-body">
<div class="main-container">
  <div class="main-page consent-page">
    <div class="main-page__image">
      <img src="images/settings/quokka.png" width="200" height="200" alt=""/>
    </div>
    <main class="main-page__info">
  <h1 class="main-page__title" data-i18n-key="consentTitle"></h1>
  <section class="options-page-card" aria-labelledby="consentSummaryTitle">
    <h2 class="block__title" id="consentSummaryTitle">TL;DR</h2>
    <div class="consent-summary-row">
      <img src="images/popup/default.png" width="64" height="64" alt=""/>
      <p class="disclaimer__text" data-i18n-key="consentSummary"></p>
    </div>
    <div class="consent-summary-row">
      <img src="images/popup/danger.png" width="64" height="64" alt=""/>
      <p class="disclaimer__text" data-i18n-key="consentSummaryDecline"></p>
    </div>
  </section>
  <section class="options-page-card">
  <h2 class="block__title" data-i18n-key="consentDetails"></h2>
  <p class="disclaimer__text" data-i18n-key="consentIntro"></p>
  <ul class="disclaimer__text">
    <li data-i18n-key="consentTraffic"></li>
    <li data-i18n-key="consentServices"></li>
    <li data-i18n-key="consentChecks"></li>
    <li data-i18n-key="consentSources"></li>
    <li data-i18n-key="consentLocal"></li>
  </ul>
  <p class="disclaimer__text" data-i18n-key="consentRetention"></p>
  <p class="disclaimer__text" data-i18n-key="consentThirdParties"></p>
  </section>
  <p class="disclaimer__text" data-i18n-key="consentPause"></p>
  <p class="disclaimer__text" data-i18n-key="consentControl"></p>
  <div class="consent-actions">
    <button type="button" class="btn btn-dark" id="acceptConsent" data-i18n-key="consentAccept" disabled></button>
    <button type="button" class="btn btn-light" id="declineConsent" data-i18n-key="consentDecline" disabled></button>
    <button type="button" class="btn btn-light" id="uninstallConsent" data-i18n-key="consentUninstall" disabled></button>
  </div>
  <p id="consentError" role="alert"></p>
</main>
  </div>
</div>
</body>
</html>
